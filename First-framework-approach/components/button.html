<!--
  COMPOSANT BUTTON (Bouton)
  ==========================
  
  💡 PARALLÈLE AVEC FIGMA :
  Dans Figma, vous avez probablement plusieurs variantes de boutons 
  (primaire, secondaire, ghost). Ce fichier montre les différentes variantes.
  
  UTILISATION :
  1. Ouvrir ce fichier
  2. Copier la variante de bouton dont vous avez besoin
  3. Coller dans votre page HTML
  4. Adapter le texte et le lien
  
  BEM :
  - Block : button
  - Modifiers : button--primary, button--secondary, button--ghost
-->

<!-- Variante primaire -->
<a href="#" class="button button--primary">Texte du bouton</a>

<!-- Variante secondaire -->
<a href="#" class="button button--secondary">Texte du bouton</a>

<!-- Variante ghost (transparent) -->
<a href="#" class="button button--ghost">Texte du bouton</a>

<!-- Si c'est un bouton (pas un lien), utiliser la balise <button> -->
<button type="button" class="button button--primary">Action</button>
